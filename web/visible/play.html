<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Outbreak · Blackwood</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #101310; color: #e8ece4; font: 15px/1.5 system-ui, sans-serif; }
    .page { width: min(1440px, calc(100% - 40px)); height: 100dvh; min-height: 100svh; margin: auto; padding: 22px 0 16px; display: flex; flex-direction: column; gap: 16px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; }
    .eyebrow { margin: 0 0 3px; color: #a9b697; font-size: 11px; font-weight: 650; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); font-weight: 650; letter-spacing: -.045em; line-height: 1.1; }
    #status { max-width: 520px; margin: 0; color: #b9c0b2; font-size: 13px; text-align: right; }
    .stage { flex: 1; min-height: 240px; display: grid; place-items: center; container-type: size; background: #070907; border: 1px solid #30382b; border-radius: 8px; overflow: hidden; }
    canvas { display: block; width: 100%; height: auto; max-height: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; outline: none; }
    canvas:focus-visible { outline: 2px solid #b5cc8f; outline-offset: -3px; }
    @supports (width: 1cqw) { canvas { width: min(100cqw, calc(100cqh * 16 / 9)); } }
    .help { display: flex; justify-content: space-between; align-items: start; gap: 18px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0; padding: 0; list-style: none; font-size: 13px; color: #c2c9bb; }
    .controls li { white-space: nowrap; }
    kbd { display: inline-block; min-width: 22px; margin-right: 4px; padding: 1px 5px; border: 1px solid #48513f; border-radius: 4px; background: #1e241b; color: #eff2e9; font: inherit; font-size: 12px; text-align: center; }
    .hint { margin: 0; color: #969f8c; font-size: 12px; }
    .session-note { margin: 8px 0 0; color: #969f8c; font-size: 12px; }
    #errors { margin: 0; padding: 10px 14px; border-left: 3px solid #d3a07e; background: #251c17; color: #f2c9ae; white-space: pre-wrap; overflow-wrap: anywhere; }
    #errors[hidden] { display: none; }
    details { flex: none; color: #969f8c; font-size: 12px; }
    summary { cursor: pointer; width: fit-content; }
    #messages { max-height: 130px; overflow: auto; margin: 8px 0 0; padding: 10px; background: #080b08; white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (max-width: 700px) {
      .page { width: calc(100% - 24px); padding-top: 16px; gap: 12px; }
      header, .help { align-items: start; flex-direction: column; gap: 10px; }
      #status { text-align: left; }
      .controls { gap: 6px 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div><p class="eyebrow">Blackwood · Browser client</p><h1>Outbreak</h1></div>
      <p id="status" role="status" aria-live="polite">Loading engine…</p>
    </header>
    <section class="stage" aria-label="Game view">
      <canvas id="canvas" width="960" height="540" tabindex="0" aria-label="Outbreak game canvas" aria-describedby="focus-hint"></canvas>
    </section>
    <p id="errors" role="alert" hidden></p>
    <footer>
      <div class="help">
        <ul class="controls" aria-label="Game controls">
          <li><kbd>W A S D</kbd> Move</li>
          <li><kbd>Space</kbd> Jump</li>
          <li><kbd>C</kbd> Crouch</li>
          <li><kbd>1 / 2</kbd> Pistol / Rifle</li>
          <li><kbd>R</kbd> Reload</li>
          <li><kbd>Mouse 1</kbd> Fire</li>
        </ul>
        <p class="hint" id="focus-hint">Click the game to focus · Mouse to look · Esc releases the pointer</p>
      </div>
      <p class="session-note">Keyboard and mouse · A private game session is required.</p>
    </footer>
    <details><summary>Client messages</summary><pre id="messages" aria-label="Recent engine messages"></pre></details>
    <noscript>JavaScript is required to load the compiled Outbreak client.</noscript>
  </main>
  <script>
    var engineState = 'loading';
    var canvas = document.getElementById('canvas');
    var statusText = document.getElementById('status');
    var errorText = document.getElementById('errors');
    var messages = document.getElementById('messages');
    var bundleURL = new URL('candidates/stock-combat-1/bundle/', document.baseURI);
    var networkTimer = null;
    var networkTransition = '';
    var networkStates = {
      BN_IDLE: 'Waiting for a game connection', BN_OPENING: 'Connecting…',
      BN_OPEN: 'Joining…', BN_JOINING: 'Joining…', BN_ACTIVE: 'Playing',
      BN_CLOSING: 'Closed', BN_FAILED: 'Connection failed'
    };
    // browsernet.h error values; only these fixed descriptions enter diagnostics.
    var networkErrors = [
      'No error', 'Session setup is invalid', 'Unable to open the connection',
      'Connection closed', 'Unexpected message type', 'Invalid message size',
      'Connection queue limit reached', 'Connection timed out', 'Unexpected server target',
      'Stale connection', 'Authentication failed', 'Map verification failed',
      'Join sequence failed', 'Session capability already used', 'Network transport failed',
      'Session closed when the page became hidden'
    ];

    function clientMessage(text) {
      messages.textContent = (messages.textContent + String(text) + '\n').slice(-8192);
      messages.scrollTop = messages.scrollHeight;
    }

    function stopNetworkStatus() {
      if (networkTimer !== null) window.clearInterval(networkTimer);
      networkTimer = null;
    }

    function readNetworkStatus() {
      if (engineState !== 'initialized') return;
      var state = 'unavailable';
      var error = 0;
      var label = 'Awaiting client initialization…';
      var detail = 'Network snapshot not available';
      try {
        if (typeof window.outbreakNetworkSnapshot === 'function') {
          var snapshot = window.outbreakNetworkSnapshot();
          if (!snapshot || snapshot.schema_version !== 1 ||
              !Object.prototype.hasOwnProperty.call(networkStates, snapshot.state) ||
              !Number.isInteger(snapshot.error) || snapshot.error < 0 || snapshot.error >= networkErrors.length) {
            state = 'invalid'; label = 'Connection failed'; detail = 'Invalid network snapshot';
          } else {
            state = snapshot.state; error = snapshot.error;
            label = error ? 'Connection failed' : networkStates[state];
            detail = 'Network ' + state + ' · Error ' + error + ': ' + networkErrors[error];
          }
        }
      } catch (_) {
        state = 'unreadable'; label = 'Connection failed'; detail = 'Unable to read network snapshot';
      }
      // Do not copy snapshots, boot data, arbitrary exception text or per-frame counters.
      var transition = state + ':' + error;
      if (transition !== networkTransition) {
        networkTransition = transition;
        clientMessage(detail);
      }
      statusText.textContent = label;
    }

    function startNetworkStatus() {
      stopNetworkStatus();
      if (engineState !== 'initialized' || document.hidden) return;
      readNetworkStatus();
      networkTimer = window.setInterval(readNetworkStatus, 500);
    }

    function clientFailed(reason) {
      var text = String(reason || 'The client stopped unexpectedly.');
      clientMessage(text);
      if (engineState === 'error') return;
      engineState = 'error';
      stopNetworkStatus();
      statusText.textContent = 'Client stopped';
      errorText.textContent = text.slice(0, 2048);
      errorText.hidden = false;
    }

    // The runtime supervisor supplies OUTBREAK_NETWORK_BOOT before this script
    // starts. This page never creates, changes or displays that capability.
    var Module = {
      canvas: canvas,
      locateFile: function(filename) { return new URL(filename, bundleURL).href; },
      setStatus: function(text) {
        if (engineState === 'loading') statusText.textContent = text || 'Starting engine…';
      },
      print: function(text) { console.log(text); clientMessage(text); },
      printErr: function(text) { console.error(text); clientMessage(text); },
      onAbort: clientFailed,
      onRuntimeInitialized: function() {
        if (engineState !== 'loading') return;
        engineState = 'initialized';
        statusText.textContent = 'Awaiting client initialization…';
        startNetworkStatus();
      },
      onExit: function(code) {
        if (engineState === 'error') return;
        engineState = 'stopped';
        stopNetworkStatus();
        statusText.textContent = 'Client exited (' + code + ')';
      }
    };

    document.addEventListener('visibilitychange', function() {
      if (document.hidden) stopNetworkStatus();
      else startNetworkStatus();
    });
    window.addEventListener('pagehide', stopNetworkStatus);
    window.addEventListener('pageshow', startNetworkStatus);

    canvas.addEventListener('pointerdown', function(event) {
      if (event.button === 0) canvas.focus({preventScroll: true});
    });
    canvas.addEventListener('contextmenu', function(event) { event.preventDefault(); });
    // Mouse capture/audio remain owned by the engine's genuine canvas gesture.
    window.addEventListener('error', function(event) {
      if (event.message) clientFailed(event.message);
    });
    window.addEventListener('unhandledrejection', function(event) {
      clientFailed(event.reason && event.reason.message || event.reason);
    });
  </script>
  <script defer src="candidates/stock-combat-1/bundle/index.js"
    onerror="clientFailed('Unable to load the client files. Start this page through the authorized local session.');"></script>
</body>
</html>
