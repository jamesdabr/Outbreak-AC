// Minimal original offline-map bindings; browser pointer lifecycle belongs to T028.
keymap 119 W
bind W [forward]
keymap 115 S
bind S [backward]
keymap 97 A
bind A [left]
keymap 100 D
bind D [right]
keymap 32 SPACE
bind SPACE [jump]
keymap 99 C
bind C [crouch]
keymap 114 R
bind R [reload]
keymap -1 MOUSE1
bind MOUSE1 [attack]
fov 90
sensitivity 3
hudgun 0
audio 0
soundvol 0
musicvol 0
dynshadow 0
stencilshadow 0
waterreflect 0
hideradar 1
hideigraphs 1
hidecompass 1
hideteam 1
autodownload 0
scriptcontext MAPCFG texture
scriptcontext MAPCFG texturereset
scriptcontext MAPCFG mapmodelreset
scriptcontext MAPCFG mapsoundreset
scriptcontext MAPCFG fog
scriptcontext MAPCFG fogcolour
isolatecontext MAPCFG
scriptcontext MDLCFG md3load
scriptcontext MDLCFG md3skin
scriptcontext MDLCFG md3anim
scriptcontext MDLCFG mdlscale
scriptcontext MDLCFG mdltrans
isolatecontext MDLCFG
sealcontexts
